<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">J · A · R · V · I · S</div>
    <div class="sub">Just A Rather Very Intelligent System</div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <main>
    <section class="panel">
      <h2>Dialog</h2>
      <div class="log" id="log"></div>
    </section>

    <div class="stage">
      <div class="reactor" id="reactor" title="Klicken zum Sprechen">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="ring r4"></div>
        <div class="core"></div>
      </div>
      <div class="status-line" id="status">STANDBY</div>
      <button class="mic-btn" id="micBtn">🎙 Sprechen</button>
      <div class="mic-error" id="micError"></div>
    </div>

    <section class="panel">
      <h2>Aktuelle Mission</h2>
      <div class="goal-current">
        <div class="label">Ziel</div>
        <div class="text empty" id="goalText">Noch kein Ziel definiert</div>
      </div>
      <ul class="steps" id="steps"></ul>
      <div class="metrics">
        <div class="metric"><div class="top"><span>Systemlast</span><span id="v1">14%</span></div><div class="bar"><div class="fill" id="f1" style="width:14%"></div></div></div>
        <div class="metric"><div class="top"><span>Fortschritt</span><span id="v2">0%</span></div><div class="bar"><div class="fill" id="f2" style="width:0%"></div></div></div>
        <div class="metric"><div class="top"><span>Verbindung</span><span id="v3">98%</span></div><div class="bar"><div class="fill" id="f3" style="width:98%"></div></div></div>
      </div>
    </section>
  </main>

  <footer>
    <input id="textInput" placeholder="Sag Jarvis dein Ziel … z.B. „Verdiene 500 Euro für uns"" autocomplete="off" />
    <button id="sendBtn">Senden</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
