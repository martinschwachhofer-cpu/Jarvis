<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>J.A.R.V.I.S. — Wealth Operations</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark">J</span>
      <div class="wordmark">
        <div class="logo">JARVIS</div>
        <div class="sub">Autonomous Wealth Operations</div>
      </div>
    </div>
    <div class="header-right">
      <div class="session-id">SESSION <span id="sessionId">JV-0000</span></div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </header>

  <div class="ticker" id="ticker" aria-hidden="true">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <main>
    <section class="panel log-panel">
      <h2>Kommunikationsprotokoll</h2>
      <div class="log" id="log"></div>
    </section>

    <div class="stage">
      <div class="reactor" id="reactor" title="Klicken zum Sprechen">
        <div class="ring bezel" aria-hidden="true"></div>
        <div class="ring arc arc-a" aria-hidden="true"></div>
        <div class="ring arc arc-b" aria-hidden="true"></div>
        <div class="ring track" aria-hidden="true"></div>
        <div class="ring orbit orbit-1" aria-hidden="true"><span class="dot"></span></div>
        <div class="ring orbit orbit-2" aria-hidden="true"><span class="dot"></span></div>
        <div class="core"></div>
        <div class="reticle" aria-hidden="true"></div>
        <div class="readout readout-tl" id="readoutTL">SYNC <span id="readoutSync">98.4%</span></div>
        <div class="readout readout-br" id="readoutBR">Θ <span id="readoutTheta">042°</span></div>
      </div>
      <div class="status-line" id="status">STANDBY</div>
      <button class="mic-btn" id="micBtn">🎙 Sprechen</button>
      <div class="mic-error" id="micError"></div>
    </div>

    <section class="panel mission-panel">
      <h2>Mandat</h2>
      <div class="goal-card">
        <div class="goal-card-top">
          <span class="label">Zielkapital</span>
          <span class="chip" id="goalChip">Kein Mandat</span>
        </div>
        <div class="text empty" id="goalText">Noch kein Ziel definiert</div>
        <div class="goal-sub" id="goalSub"></div>
      </div>

      <div class="section-label">Ausführungsplan</div>
      <ol class="steps" id="steps"></ol>

      <div class="kpis">
        <div class="kpi">
          <div class="kpi-top"><span>Kapitalauslastung</span><span id="v1" class="num">14%</span></div>
          <div class="bar"><div class="fill fill-neutral" id="f1" style="width:14%"></div></div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><span>Zielerreichung</span><span id="v2" class="num">0%</span></div>
          <div class="bar"><div class="fill fill-primary" id="f2" style="width:0%"></div></div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><span>Systemintegrität</span><span id="v3" class="num">98%</span></div>
          <div class="bar"><div class="fill fill-neutral" id="f3" style="width:98%"></div></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <input id="textInput" placeholder="Formulieren Sie Ihr Mandat … z. B. „Verdiene 500 Euro für uns"" autocomplete="off" />
    <button id="sendBtn">Senden</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
